name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Gemfile.lock is not committed (this is a gem), so every job resolves the
# newest dependencies that support its Ruby, as the gem's users will.
jobs:
  rubocop:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    name: test (Ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # "3.2" is the gemspec's required_ruby_version; "ruby" is the latest stable release.
        ruby: ["3.2", ruby]
        include:
          - os: macos-latest
            ruby: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test:core
      - run: bundle exec rake test:integrations
      - run: bundle exec rake test:rails
      - run: gem build goodsorcery.gemspec

  # Plain Ruby apps (Rack, Sinatra, scripts, Lambda) get only the gemspec's
  # dependencies. Rails, Sidekiq and friends sit in the Gemfile's
  # development group and pull in gems (such as logger) the gem itself
  # needs, so the main job would not notice a missing dependency.
  without-rails:
    name: test without Rails (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", ruby]
    env:
      BUNDLE_WITHOUT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Load the gem with only its runtime dependencies
        run: bundle exec ruby -e 'require "goodsorcery"; abort "Rails loaded" if defined?(Rails); puts GoodSorcery::VERSION'
      - run: bundle exec rake test:core
